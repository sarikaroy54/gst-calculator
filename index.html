```
<main class="container">
  <section>
    <p>
      Enter your amount and GST rate to calculate the GST amount and total
      price instantly.
    </p>
  </section>

  <section>
    <div class="grid">
      <input
        placeholder="Enter amount"
        id="inputOne"
        type="number"
        required
      />

      <input
        placeholder="Enter GST Percentage"
        id="inputTwo"
        type="number"
        required
      />

      <button type="button" id="btn">Calculate GST</button>
    </div>
  </section>

  <section>
    <p id="result"></p>
  </section>
</main>

<footer class="container neog-footer">
  <small>
    Go from zero to hero in full-stack development with
    <a href="https://neog.camp">neog.camp</a>
  </small>
</footer>

<script>
 
  const buttonElement = document.getElementById("btn")

  function calculation(inputFirst, inputSecond){
    const resultOne = inputFirst*inputSecond/100
    const resultLast = inputFirst + resultOne
    return{
      resultOne: resultOne.toFixed(2),
      resultLast: resultLast.toFixed(2),
    }
  }
  

  function HandleButton(){
    const inputElementFirst = document.getElementById("inputOne")
  const inputElementSecond = document.getElementById("inputTwo")
  const inputFirst = Number(inputElementFirst.value)
  const inputSecond = Number(inputElementSecond.value)
  const resultElement = document.getElementById("result")
  const output = calculation(inputFirst, inputSecond)

  resultElement.innerText = "Your gst amount is " + output.resultOne + " and final amount is: " + output.resultLast
  
  }

  buttonElement.addEventListener("click",HandleButton)
</script>


  </body>
</html>
